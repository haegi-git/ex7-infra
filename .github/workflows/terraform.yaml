name: Terraform CI/CD Pipeline

# 1. 트리거 조건 설정 : 어떤 이벤트에서 워크프롤우를 실행할지 지정
on:
  push:
    branches: [main]
    paths:
      # - 'infra/project/**'
  #       - 'project/**'
# pull_request:
#   branches: [main]
#   paths:
#     - 'infra/project/**'
#       - 'project/**'
# paths : 배포 기준이 될 파일이 있는 위치(변경된 파일 기준) ex) infra/**

# 2. 권한 설정 : 워크프롤우가 실행할 수 있는 권한 설정 (OpenId Connect 또는 시크릿 접근 권한)
permissions:
  contents: read
# 3. 전체 작업에 대한 서버 구성 및 배포 설정 파일의 위치
jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/project
# 3-1. 소스 코드 체크아웃 (체크아웃: 저장소의 파일을 러너로 다운로드)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
# 3-2. 테라폼 CLI 도구 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.x
# 3-3. AWS 인증 정보 설정 (Github Secrets 활용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com # AWS 접속에 사용될 토큰 발급 대상 지정
          output-env-credentials: true # 깃허브 액션의 환경 변수 자동 저장
# 3-4. 테라폼 초기화 (프로바이더 다운로드)
      - name: Terraform Init
        run: terraform init
# 3-5. 테라폼 코드 포맷 검증
      - name: Terraform Validate
        run: terraform validate
# 3-6. 변경 사항 미리보기 Plan
      - name: Terraform Plan
        run: terraform plan -no-color # 브라우저 출력시 색 코드로 인한 글자 깨짐 방지
        continue-on-error: false # 에러 발생시 계속진행(true) 또는 중단(false)
# 3-7. 인프라 반영 (apply / destroy)
      - name: Terraform Apply & Destroy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve